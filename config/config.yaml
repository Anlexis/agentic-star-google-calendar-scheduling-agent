# Runtime parameters — loaded by AgentRegistry, passed as Graph(config=...).
# Separate from config/agent.yaml (the static manifest).

max_retry: 3
timeout_s: 30

# Google Calendar API v3 integration settings - forwarded to the inner
# workflow graph by CalendarWorkflowGraphNode._parent_config().
google_calendar:
  base_url: "https://www.googleapis.com/calendar/v3"
  calendar_id: "primary"
